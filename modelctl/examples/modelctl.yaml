version: 1

defaults:
  startup_timeout_s: 1200
  graceful_stop_timeout_s: 30
  kill_timeout_s: 15
  cleanup_verify_timeout_s: 30
  bind_host: 127.0.0.1
  access: tunnel
  lifecycle: { mode: persistent }
  security:
    request_logging: false
    output_logging: false
    allow_remote_exposure: false
    state_file_mode: "0600"
    state_dir_mode: "0700"

machines:
  gpu-a:
    ssh: { host: gpu-a.example.internal, user: ink }
    supervisor: systemd-user
    inventory:
      roots: [/models, /mnt/models]
      max_age_before_start_s: 3600
      auto_refresh_before_start: true
    runtime: { type: venv, activate: /opt/vllm/bin/activate }
    gpu: { sharing: exclusive-managed }
    defaults: { port: 8000, gpu_memory_utilization: 0.90 }

models:
  qwen-72b:
    served_model_name: qwen-72b
    generation_config: vllm

targets:
  qwen-72b@gpu-a:
    model: qwen-72b
    machine: gpu-a
    artifact: { path: /models/Qwen2.5-72B-Instruct, require_observed: true }
    gpus: [0, 1, 2, 3]
    lifecycle: { mode: persistent }
    tunnel: { local_port: 18000 }
    vllm:
      tensor_parallel_size: 4
      max_model_len: 32768
      gpu_memory_utilization: 0.92
      dtype: auto

delegation:
  enabled: true
  brain: { owner: codex, final_authority: true }
  backend: { type: opencode, executable: opencode, provider: zai-coding-plan }
  roles:
    driver: { max_parallel: 3, max_files_read: 80, max_files_write: 20, max_patch_lines: 1500, default_timeout_s: 1800, workspace: project_dir, validation: strong }
    worker: { max_parallel: 12, max_files_read: 20, max_files_write: 5, max_patch_lines: 300, default_timeout_s: 600, workspace: project_dir, validation: deterministic }
  orchestration:
    max_total_parallel: 12
    max_task_depth: 1
    max_task_fanout: 8
    worker_batch_size: 8
    worker_return_tokens: 800
    driver_return_tokens: 2000
    aggregate_return_tokens: 4000
    require_structured_results: true
    recursive_delegation: false
    fail_fast: true
    overlap_policy: serialize
  execution: { pure_mode: true, provider_allowlist: [zai-coding-plan] }
  validation: { require_diff_capture: true, reject_out_of_scope_changes: true }

budget:
  max_parallel_total: 12
  max_parallel_worker: 12
  max_parallel_driver: 3
  max_retry_per_candidate: 1
  max_escalations: 2
  soft_daily_usd: 5
  hard_daily_usd: 10
  go_usage_value: { hard_5h_usd: 12, hard_weekly_usd: 30, hard_monthly_usd: 60 }
