[project]
name = "modelctl"
version = "1.5.0"
description = "Industry-grade model control, remote vLLM serving, and Codex→Muse delegation plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Suresh Meena" }]
keywords = ["vllm", "model-serving", "opencode", "fleet", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/suresh-meena/dotfiles"
Repository = "https://github.com/suresh-meena/dotfiles"
Issues = "https://github.com/suresh-meena/dotfiles/issues"

[project.scripts]
modelctl = "modelctl.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
