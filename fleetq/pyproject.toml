[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetq"
version = "0.1.0"
description = "Slurm-like scheduler for a personal fleet of workstations and university Slurm clusters, hosted on numpi"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
# The client (bin/fq) and the node shim (fq-node) are stdlib-only and do not
# use these; only the daemon does.  Versions match fleetmon's vetted
# requirements-hub.lock, and fleetq keeps its own validated lock
# (requirements-daemon.lock) rather than trusting that file blindly.
dependencies = [
  "fastapi==0.115.14",
  "starlette==0.46.2",
  "pydantic==2.13.5",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx==0.28.1"]

[project.scripts]
fleetqd = "fleetq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # FastAPI 0.115 (pinned to fleetmon's vetted lock) calls a function Python
  # 3.14 deprecates. Not ours; silenced by exact message only.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
markers = [
  "crash: crash-injection tests that restart the controller",
  "model: randomized model/property tests",
  "systemd_it: real local systemd integration (opt-in, FQ_SYSTEMD_IT=1)",
]

# bin/fq and build/fq-node are generated by scripts/build.py, so only their
# sources are linted.
[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Bugs and dead code, not style: unused imports and variables, redefinitions,
# bugbear, pylint errors, blocking calls in async code, and stale noqa comments.
select = ["E4", "E7", "E9", "F", "B", "PLE", "ASYNC", "RUF100"]
ignore = [
  "E701", "E702", "E731", "E741",  # one-line statements and short names: style
  "B023",      # loop closures here run within their iteration (store.run, retries)
  "B904",      # exception chaining is style here
  "ASYNC109",  # async APIs take an explicit timeout by design
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported from sibling test modules and rebound as parameters.
"tests/**" = ["F811"]
# `fleetqd node install` runs this alone under asyncio.run, not on the daemon loop.
"src/fleetq/onboard.py" = ["ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fleetq.bundles.BundleLimits"]
