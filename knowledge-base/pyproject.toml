[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-kb"
version = "1.0.0"
description = "Research knowledge base runtime: revisioned records, sources, evidence, work, and optional execution provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Research KB" }]
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]
dev = ["pytest>=8.0"]

[project.scripts]
rkb = "research_kb.clients.cli:main"
rkb-mcp = "research_kb.transports.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_kb = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/research-kb/tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
