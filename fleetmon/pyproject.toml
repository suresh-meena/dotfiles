[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmon"
version = "0.2.0"
description = "Low-impact, pull-based compute fleet monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Fleetmon contributors"}]
dependencies = [
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
nvml = [
  "nvidia-ml-py>=12,<14",
]
hub = [
  "fastapi>=0.115,<0.116",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn>=0.30,<0.35",
]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
]

[project.scripts]
fleetmon = "fleetmon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleetmon.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]
