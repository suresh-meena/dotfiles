<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Fleetmon — {{TITLE}}</title>
    <link rel="stylesheet" href="/static/fleetmon.css">
    <script src="/static/theme.js"></script>
  </head>
  <body data-page="{{PAGE}}" data-target="{{TARGET}}">
    <header>
      <a class="brand-link" href="/overview">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1" y="7" width="3.5" height="8" rx="1"/>
          <rect x="6.25" y="1" width="3.5" height="14" rx="1"/>
          <rect x="11.5" y="4" width="3.5" height="11" rx="1"/>
        </svg>
        Fleetmon
      </a>
      <div class="header-actions">
        <button id="theme" type="button" aria-label="Color theme: auto" data-mode="auto">
          <svg class="icon icon-auto" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6"/>
            <path class="icon-solid" d="M8 2a6 6 0 0 1 0 12z"/>
          </svg>
          <svg class="icon icon-light" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/>
          </svg>
          <svg class="icon icon-dark" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/>
          </svg>
          <span class="theme-label">auto</span>
        </button>
        <button id="menu" type="button" aria-label="Toggle navigation" aria-controls="nav" aria-expanded="false">menu</button>
      </div>
    </header>
    <nav id="nav" aria-label="Pages and hosts">
      <div class="nav-inner">
        <ul class="nav-pages">
          <li><a href="/overview" data-nav="overview">Overview</a></li>
          <li><a href="/idle-gpus" data-nav="idle-gpus">Idle GPUs</a></li>
          <li><a href="/queue" data-nav="queue">Queue</a></li>
          <li><a href="/nodes" data-nav="nodes">Nodes</a></li>
          <li><a href="/jobs" data-nav="jobs">Jobs</a></li>
          <li><a href="/hub-status" data-nav="hub-status">Hub Status</a></li>
        </ul>
        <h2 class="nav-heading">Hosts</h2>
        <ul id="host-list" class="nav-hosts"></ul>
      </div>
    </nav>
    <main>
      <div class="page-head">
        <h1 id="page-title">{{TITLE}}</h1>
        <p id="status" class="loading" role="status">Loading…</p>
      </div>
      <noscript>
        <p class="note">Enable JavaScript to view live readings.</p>
      </noscript>
      <section id="content" aria-labelledby="page-title"></section>
    </main>
    <script src="/static/fleetmon.js"></script>
  </body>
</html>
